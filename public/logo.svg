    <rect x="0" y="0" width="105" height="105" rx="26" fill="url(#tileBlue)" stroke="#BAE6FD" stroke-width="4" />
    <path d="M 12 12 Q 52 8 93 12 Q 88 35 17 35 Z" fill="#FFFFFF" fill-opacity="0.45" />
    <text x="52" y="76" font-size="68" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>

  <g transform="translate(395, 45) rotate(6)">
    <rect x="0" y="8" width="95" height="95" rx="24" fill="#3B0764" />
    <rect x="0" y="4" width="95" height="95" rx="24" fill="#7E22CE" />
    <rect x="0" y="0" width="95" height="95" rx="24" fill="url(#tilePurple)" stroke="#E9D5FF" stroke-width="4" />
    <path d="M 10 10 Q 48 8 85 10 Q 80 30 15 30 Z" fill="#FFFFFF" fill-opacity="0.4" />
    <text x="48" y="69" font-size="62" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">L</text>
  </g>

  <g transform="translate(815, 60) rotate(14)">
