<svg viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowLeft" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#0077B6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#03045E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlowRight" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E00" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#FF5400" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9D0208" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="alphaFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2F1FF" />
      <stop offset="60%" stop-color="#90CAFF" />
      <stop offset="100%" stop-color="#4A90E2" />
    </linearGradient>
    <linearGradient id="alpha3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B1947" />
    </linearGradient>
    <linearGradient id="blastFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="30%" stop-color="#FFDD00" />
      <stop offset="70%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="blast3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C82000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <linearGradient id="tileBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
