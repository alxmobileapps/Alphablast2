    <rect x="0" y="4" width="105" height="105" rx="26" fill="#C2410C" />
    <rect x="0" y="0" width="105" height="105" rx="26" fill="url(#tileOrange)" stroke="#FED7AA" stroke-width="4" />
    <path d="M 12 12 Q 52 8 93 12 Q 88 35 17 35 Z" fill="#FFFFFF" fill-opacity="0.45" />
    <text x="52" y="76" font-size="68" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">P</text>
  </g>

  <g transform="translate(160, 345) rotate(-8)">
    <rect x="0" y="8" width="95" height="95" rx="24" fill="#500724" />
    <rect x="0" y="4" width="95" height="95" rx="24" fill="#9D174D" />
    <rect x="0" y="0" width="95" height="95" rx="24" fill="url(#tilePink)" stroke="#FBCFE8" stroke-width="4" />
    <path d="M 10 10 Q 48 8 85 10 Q 80 30 15 30 Z" fill="#FFFFFF" fill-opacity="0.4" />
    <text x="48" y="69" font-size="62" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
  </g>

  <g transform="translate(420, 360) rotate(8)">
    <rect x="0" y="8" width="105" height="105" rx="26" fill="#052E16" />
    <rect x="0" y="4" width="105" height="105" rx="26" fill="#15803D" />
    <rect x="0" y="0" width="105" height="105" rx="26" fill="url(#tileGreen)" stroke="#BBF7D0" stroke-width="4" />
    <path d="M 12 12 Q 52 8 93 12 Q 88 35 17 35 Z" fill="#FFFFFF" fill-opacity="0.45" />
    <text x="52" y="76" font-size="68" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
  </g>

  <g transform="translate(755, 345) rotate(12)">
    <rect x="0" y="8" width="100" height="100" rx="25" fill="#2E1065" />
    <rect x="0" y="4" width="100" height="100" rx="25" fill="#6B21A8" />
    <rect x="0" y="0" width="100" height="100" rx="25" fill="url(#tileViolet)" stroke="#DDD6FE" stroke-width="4" />
    <path d="M 10 10 Q 50 8 90 10 Q 85 32 15 32 Z" fill="#FFFFFF" fill-opacity="0.4" />
    <text x="50" y="72" font-size="64" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">Z</text>
  </g>

  <!-- Crystals -->
  <polygon points="90,240 75,255 90,270 105,255" fill="#00F0FF" opacity="0.9" />
  <polygon points="310,120 300,130 310,140 320,130" fill="#70D6FF" opacity="0.85" />
  <polygon points="325,370 310,390 325,410 340,390" fill="#00D4FF" opacity="0.9" />
  <polygon points="650,85 640,95 650,105 660,95" fill="#FFDD00" opacity="0.95" />
  <polygon points="805,175 795,185 805,195 815,185" fill="#FFAA00" opacity="0.85" />
  <polygon points="895,385 875,400 895,415 915,400" fill="#FFD000" opacity="0.9" />

  <!-- Single Word AlphaBlast Title -->
  <g id="main-title-group" transform="skewX(-6)">
    <text x="490" y="298" font-size="158" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" letter-spacing="-2" text-anchor="middle" fill="#030816" stroke="#030816" stroke-width="38" stroke-linejoin="round">AlphaBlast</text>
    <text x="490" y="288" font-size="158" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" letter-spacing="-2" text-anchor="middle" fill="#0B1A48" stroke="#0284C7" stroke-width="24" stroke-linejoin="round">
      <tspan fill="url(#alpha3D)" stroke="#0284C7">Alpha</tspan>
      <tspan fill="url(#blast3D)" stroke="#B91C1C">Blast</tspan>
    </text>
    <text x="490" y="278" font-size="158" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" letter-spacing="-2" text-anchor="middle" stroke-linejoin="round">
      <tspan fill="#0C256B" stroke="#00D4FF" stroke-width="12">Alpha</tspan>
      <tspan fill="#991B1B" stroke="#FFDD00" stroke-width="12">Blast</tspan>
    </text>
    <text x="490" y="274" font-size="158" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" letter-spacing="-2" text-anchor="middle" stroke-linejoin="round">
      <tspan fill="url(#alphaFront)" stroke="#FFFFFF" stroke-width="3">Alpha</tspan>
      <tspan fill="url(#blastFront)" stroke="#FFF9A6" stroke-width="3">Blast</tspan>
    </text>
    <path d="M 125 210 Q 300 200 480 208 Q 470 220 135 224 Z" fill="#FFFFFF" fill-opacity="0.45" />
    <path d="M 515 210 Q 690 198 860 208 Q 850 220 525 224 Z" fill="#FFFFFF" fill-opacity="0.45" />
  </g>

  <!-- Sparkles -->
  <polygon points="120,185 124,195 134,199 124,203 120,213 116,203 106,199 116,195" fill="#FFFFFF" />
  <polygon points="265,160 268,168 276,171 268,174 265,182 262,174 254,171 262,168" fill="#FFFFFF" />
  <polygon points="530,170 535,182 547,187 535,192 530,204 525,192 513,187 525,182" fill="#FFFBEA" />
  <polygon points="860,205 864,213 872,216 864,219 860,227 856,219 848,216 856,213" fill="#FFDD00" />
