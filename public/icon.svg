<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#071330" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#071330" />
      <stop offset="100%" stop-color="#020817" />
    </linearGradient>
    <linearGradient id="tileA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="tileB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="tileC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="url(#iconGlow)" />

  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Decorative Sparkles -->
  <circle cx="90" cy="110" r="8" fill="#FDE047" />
  <circle cx="430" cy="120" r="10" fill="#38BDF8" />
  <circle cx="410" cy="400" r="7" fill="#F472B6" />

  <!-- Tile A (Top-Left Blue) -->
  <g transform="translate(100, 95) rotate(-10)" filter="url(#tileShadow)">
    <rect x="0" y="8" width="140" height="140" rx="32" fill="#0B1E4A" />
    <rect x="0" y="4" width="140" height="140" rx="32" fill="#0369A1" />
    <rect x="0" y="0" width="140" height="140" rx="32" fill="url(#tileA)" stroke="#BAE6FD" stroke-width="4" />
    <path d="M 16 16 Q 70 10 124 16 Q 116 45 22 45 Z" fill="#FFFFFF" fill-opacity="0.45" />
    <text x="70" y="102" font-size="92" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>

  <!-- Tile B (Bottom-Right Amber Blast) -->
  <g transform="translate(235, 215) rotate(8)" filter="url(#tileShadow)">
    <rect x="0" y="10" width="165" height="165" rx="38" fill="#78350F" />
    <rect x="0" y="5" width="165" height="165" rx="38" fill="#B45309" />
    <rect x="0" y="0" width="165" height="165" rx="38" fill="url(#tileB)" stroke="#FEF08A" stroke-width="5" />
    <path d="M 20 20 Q 82 12 145 20 Q 135 55 26 55 Z" fill="#FFFFFF" fill-opacity="0.5" />
    <text x="82" y="120" font-size="110" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
  </g>

  <!-- Tile C (Small floating Purple) -->
  <g transform="translate(290, 75) rotate(18)" filter="url(#tileShadow)">
    <rect x="0" y="6" width="90" height="90" rx="22" fill="#3B0764" />
    <rect x="0" y="0" width="90" height="90" rx="22" fill="url(#tileC)" stroke="#E9D5FF" stroke-width="3" />
    <text x="45" y="65" font-size="58" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">★</text>
  </g>
</svg>
